name: APK download
on:
  workflow_run:
    workflows: [Android APK]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: Schifferstadt-Android-APK
          path: apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
          BUILD_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          printf '%s\n' 'Installierbare Android-Vorabversion (Android 8+ mit WebGL2).' '' 'Enthält echte OpenStreetMap-Geometrie für den Innenstadtbereich von Schifferstadt, Offline-Karte, Spaziermodus, Vogelperspektive, simulierte Tageszeit und lokale Lieblingsorte.' '' 'APK gebaut und Signatur geprüft. Offline-3D und Bedienung im mobilen Browser automatisch getestet. Kein Test auf einem physischen Android-Gerät. Schematische Gebäude mit teils geschätzten Höhen; keine fotorealistischen Straßenaufnahmen.' '' 'APK ist für die direkte Installation mit einem Entwicklungsschlüssel signiert. Für spätere Builds kann eine Deinstallation vor der Neuinstallation erforderlich sein.' '' "Build: $BUILD_URL" > notes.md
          gh release create "android-$BUILD_NUMBER" apk/Schifferstadt-Entdecker.apk apk/SHA256SUMS.txt apk/package-info.txt --target "$BUILD_COMMIT" --title "Schifferstadt Entdecker – Android $BUILD_NUMBER" --notes-file notes.md --prerelease
