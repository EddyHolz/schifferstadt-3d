name: APK download
on:
  workflow_run:
    workflows: [Android APK]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: Schifferstadt-SOPS-APK
          path: apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
          BUILD_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          printf '%s\n' 'S-OPS: installierbarer Android-Ego-Shooter-Prototyp (Android 8+ mit WebGL2), offline im Querformat.' '' 'Zwei frei entworfene Arenen Nordcampus und Südcampus mit Schifferstadt-Bezug. Keine Nachbildung realer Schulen. 120-Sekunden-Matches gegen fünf Trainingsroboter, Kontrollpunkt, zwei Waffen, Visier, Nachladen, Regeneration und Respawns.' '' 'APK gebaut und Signatur geprüft. Wege durch beide Maps sowie Offline-Spielstart, Schießen, Nachladen, Bewegung, Visier, Pause und Mapwechsel automatisch getestet. Kein Test auf einem physischen Android-Gerät. Eigenständige synthetische 3D-Grafik; keine CoD-Assets oder MW2-Grafikqualität. Kein Online-Multiplayer.' '' 'APK ist für die direkte Installation mit einem Entwicklungsschlüssel signiert. Für spätere Builds kann eine Deinstallation vor der Neuinstallation erforderlich sein.' '' "Build: $BUILD_URL" > notes.md
          gh release create "sops-$BUILD_NUMBER" apk/Schifferstadt-SOPS.apk apk/SHA256SUMS.txt apk/package-info.txt --target "$BUILD_COMMIT" --title "S-OPS Schifferstadt – Android $BUILD_NUMBER" --notes-file notes.md --prerelease
