name: Exterior reference research
on:
  push:
    branches: [main]
    paths: ['tools/fetch-map-references.py', 'tools/fetch-lod2-reference.py', 'tools/fetch-lod2-buildings.py', '.github/workflows/exterior-research.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve primary exterior references and OSM footprints
        run: python3 tools/fetch-map-references.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-exterior-references
          path: dist/data/school-reference.json
          if-no-files-found: ignore
  lod2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official RLP LoD2 tile index independently of OSM
        run: python3 tools/fetch-lod2-reference.py
      - name: Download indexed RLP exterior meshes
        run: python3 tools/fetch-lod2-buildings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-lod2-reference-index
          path: |
            dist/data/lod2-reference-config.json
            dist/data/official-exteriors.json
          if-no-files-found: ignore
